<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One dark console look on purpose: the game screen sits between two thumb margins. */
  :root { --bg: #0b0f1c; --fg: #efe3cf; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
<canvas id="screen"></canvas>
<div id="probe"></div>
<script>
'use strict';
// The White Front: a playable look sample. Both sample files run exactly
// this game; only the art packed in PACK differs.
const PACK = /*PACK*/null;

const VW = 208, VH = 144, HUD = 10;
const GROUND_SPEED = 32, FAR_SPEED = 7;
const PL = { speed: 80, fire: 0.13, bullet: 220, lives: 3, health: 5 };
const cv = document.getElementById('screen'), sc = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = VW * 2; off.height = VH * 2;
const g = off.getContext('2d'); g.imageSmoothingEnabled = false;

// ---------------------------------------------------------------- art
const IMG = {};
function loadAll() {
  const jobs = [];
  const load = (key, src) => jobs.push(new Promise((ok) => { const i = new Image(); i.onload = () => { IMG[key] = i; ok(); }; i.onerror = ok; i.src = src; }));
  for (const [k, v] of Object.entries(PACK.images)) load(k, v);
  return Promise.all(jobs).then(() => {
    // white silhouettes for the hit flash
    for (const k of Object.keys(PACK.images)) {
      if (!/^(e_|u_|c_)/.test(k)) continue;
      const i = IMG[k], c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
      const x = c.getContext('2d'); x.drawImage(i, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      IMG[k + '_flash'] = c;
    }
  });
}
const GR = PACK.ground; // { y0 (hi px), L (game px), top[], lane[] }
const wrapL = (x) => ((x % GR.L) + GR.L) % GR.L;
const groundTop = (wx) => GR.top[Math.floor(wrapL(wx))];
const laneAt = (wx) => GR.lane[Math.floor(wrapL(wx))];

// ---------------------------------------------------------------- sound (tiny, made in code)
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f0, f1, dur, type = 'square', vol = 0.05) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain(), lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2400; o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(lp); lp.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function boom(vol = 0.25, dur = 0.5, cut = 900) {
  if (!AC) return; const t = AC.currentTime;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), lp = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = noiseBuf; lp.type = 'lowpass'; lp.frequency.setValueAtTime(cut, t); lp.frequency.exponentialRampToValueAtTime(80, t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.connect(lp); lp.connect(v); v.connect(AC.destination); s.start(t); s.stop(t + dur);
}
const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* not on iPhone */ } };

// ---------------------------------------------------------------- layout + controls
let L = null;
const probe = document.getElementById('probe');
function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3), W = innerWidth, H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const cs = getComputedStyle(probe), safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  const side = Math.max(safe.l, safe.r), availW = W - side * 2, availH = H - safe.t - safe.b;
  const scale = Math.max(0.5, Math.min(availH / VH, (availW - 118 * 2) / VW));
  const gw = VW * scale, gh = VH * scale, gx = side + (availW - gw) / 2, gy = safe.t + (availH - gh) / 2;
  const right = { x: gx + gw, w: W - side - (gx + gw), y: safe.t, h: availH };
  const fr = Math.max(30, Math.min(46, right.w * 0.27));
  L = { W, H, dpr, scale, gx, gy, gw, gh, side, fire: { x: right.x + right.w * 0.45, y: right.y + right.h * 0.68, r: fr }, portrait: H > W };
}
addEventListener('resize', layout);

const pad = { id: null, cx: 0, cy: 0, x: 0, y: 0 };
let fireIds = new Set(), keys = new Set(), tapped = false;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); tapped = true; audio();
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* fine */ }
  if (e.clientX < L.W / 2) { if (pad.id === null) { pad.id = e.pointerId; pad.cx = pad.x = e.clientX; pad.cy = pad.y = e.clientY; } }
  else fireIds.add(e.pointerId);
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== pad.id) return;
  pad.x = e.clientX; pad.y = e.clientY;
  const dx = pad.x - pad.cx, dy = pad.y - pad.cy, d = Math.hypot(dx, dy), R = 46;
  if (d > R) { pad.cx = pad.x - (dx / d) * R; pad.cy = pad.y - (dy / d) * R; } // the ring follows the thumb
});
const lift = (e) => { if (e.pointerId === pad.id) pad.id = null; fireIds.delete(e.pointerId); };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift); cv.addEventListener('lostpointercapture', lift);
addEventListener('keydown', (e) => { keys.add(e.key.toLowerCase()); if (e.key === ' ' || e.key === 'Enter') tapped = true; audio(); });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
function steer() {
  let x = 0, y = 0;
  if (pad.id !== null) {
    const dx = pad.x - pad.cx, dy = pad.y - pad.cy, d = Math.hypot(dx, dy);
    if (d > 11) { const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4); x = Math.round(Math.cos(a) * 1000) / 1000; y = Math.round(Math.sin(a) * 1000) / 1000; }
  }
  if (keys.has('arrowleft') || keys.has('a')) x = -1; if (keys.has('arrowright') || keys.has('d')) x = 1;
  if (keys.has('arrowup') || keys.has('w')) y = -1; if (keys.has('arrowdown') || keys.has('s')) y = 1;
  return { x, y };
}
const firing = () => fireIds.size > 0 || keys.has(' ') || keys.has('j');

// ---------------------------------------------------------------- the game
let S = null, mode = 'title', overT = 0, best = 0;
let seed = 1; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const T = PACK.types; // per type: sprite size (game px)
// ---------------------------------------------------------------- the front line (background preview)
// Far view (sky, ring, mountains) pans very slowly; the front line (glacier,
// bunkers, wrecks) slides past and repeats; on top, the battle moves: landing
// ships coming down, the bunkers' tracer fire, flak, fires and smoke.
const FRONT = PACK.front || null;
const MID_SPEED = 9, FAR_PAN = 0.3; // game px a second
let A = null;
function resetFront() {
  A = { mid: 0, ships: [], tracers: [], flak: [], puffs: [], gunT: FRONT ? FRONT.guns.map((_, i) => 0.5 + i * 0.7) : [], shipT: 0 };
  for (let i = 0; i < 3; i++) spawnShip(60 + i * 150);
}
function spawnShip(x) {
  const k = Math.floor(rand() * PACK.shipCount);
  A.ships.push({ k, x: x ?? 430, y: 8 + rand() * 34, vx: -(8 + rand() * 10), vy: 0.6 + rand() * 1.4, hit: 0, trail: 0 });
}
const tileW = () => IMG.front.width;
function gunsOnScreen() {
  const out = [], off = (A.mid * 2) % tileW();
  for (const [gx, gy] of FRONT.guns) for (let k = 0; k < 2; k++) { const x = gx - off + k * tileW(); if (x > 4 && x < 412) out.push([x, gy + FRONT.lineY]); }
  return out;
}
function updateFront(dt) {
  A.mid += MID_SPEED * dt;
  if ((A.shipT -= dt) <= 0) { A.shipT = 7 + rand() * 6; if (A.ships.length < 4) spawnShip(); }
  for (const sh of A.ships) {
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    if (sh.hit > 0 && Math.random() < dt * 9) A.puffs.push({ x: sh.x + 18 + Math.random() * 4, y: sh.y + 5 + Math.random() * 3, r: 1.5, life: 1.4, max: 1.4, vx: 4, vy: -5, dark: true, a: 0.35 });
  }
  A.ships = A.ships.filter((sh) => sh.x > -120 && sh.y < 150);
  // each bunker gun fires a burst of tracers at a landing ship (or the sky)
  const guns = gunsOnScreen();
  A.gunT.forEach((t, i) => { A.gunT[i] = t - dt; });
  guns.forEach(([x, y], i) => {
    const gi = i % A.gunT.length; if (A.gunT[gi] > 0) return;
    A.gunT[gi] = 1.6 + rand() * 2.4;
    const near = A.ships.filter((sh) => sh.x > x - 60 && sh.x < x + 260);
    const tg = near.length ? near[Math.floor(rand() * near.length)] : null;
    const tx = tg ? tg.x + 16 + (rand() - 0.5) * 30 : x + 60 + rand() * 120, ty = tg ? tg.y + 6 + (rand() - 0.5) * 20 : 20 + rand() * 60;
    for (let k = 0; k < 5; k++) A.tracers.push({ x, y, tx, ty, d: -k * 0.07, last: k === 4, ship: tg });
  });
  for (const tr of A.tracers) {
    tr.d += dt; if (tr.d < 0) continue;
    const L = Math.hypot(tr.tx - tr.x, tr.ty - tr.y), k = Math.min(1, (tr.d * 190) / L);
    tr.px = tr.x + (tr.tx - tr.x) * k; tr.py = tr.y + (tr.ty - tr.y) * k;
    if (k >= 1) {
      tr.done = true;
      if (tr.last) {
        A.flak.push({ x: tr.tx, y: tr.ty, t: 0 });
        if (tr.ship && Math.hypot(tr.ship.x + 16 - tr.tx, tr.ship.y + 6 - tr.ty) < 14 && Math.random() < 0.2) { tr.ship.hit = 1; A.flak.push({ x: tr.ship.x + 16, y: tr.ship.y + 4, t: 0 }); }
      }
    }
  }
  A.tracers = A.tracers.filter((tr) => !tr.done);
  for (const f of A.flak) f.t += dt;
  A.flak = A.flak.filter((f) => f.t < 1.2);
  // fresh smoke from the wrecks' fires
  const off = (A.mid * 2) % tileW();
  for (const [fx, fy, n] of FRONT.fires) if (Math.random() < dt * 0.7) for (let k = 0; k < 2; k++) {
    const x = fx - off + k * tileW(); if (x < -10 || x > 426) continue;
    A.puffs.push({ x, y: fy + FRONT.lineY - 2, r: 1.5 + Math.random() * 1.5, life: 2.4, max: 2.4, a: 0.4, vx: -6 - Math.random() * 5, vy: -9 - Math.random() * 5, dark: true, mid: true });
  }
  for (const p of A.puffs) { p.life -= dt; p.x += p.vx * dt - (p.mid ? MID_SPEED * 2 * dt : 0); p.y += p.vy * dt; p.r += dt * 2.2; }
  A.puffs = A.puffs.filter((p) => p.life > 0);
}
function drawFront() {
  g.drawImage(IMG.far, -Math.round(Math.min(S.t * FAR_PAN * 2, IMG.far.width - 416)), 0);
  for (const sh of A.ships) {
    const im = IMG['ship' + sh.k]; g.globalAlpha = 0.8; g.drawImage(im, Math.round(sh.x), Math.round(sh.y)); g.globalAlpha = 1;
    if (Math.random() < 0.5) { g.fillStyle = 'rgba(242,207,138,0.5)'; g.fillRect(Math.round(sh.x + im.width * 0.35), Math.round(sh.y + im.height - 1), 2, 2 + Math.floor(Math.random() * 3)); }
  }
  for (const f of A.flak) {
    const k = f.t / 1.2;
    if (f.t < 0.08) { g.fillStyle = '#fff1cf'; g.beginPath(); g.arc(f.x, f.y, 4, 0, 7); g.fill(); }
    g.fillStyle = `rgba(70,74,84,${0.75 * (1 - k)})`;
    for (const [dx, dy] of [[0, 0], [3, -2], [-3, 1], [1, 3]]) { g.beginPath(); g.arc(f.x + dx * (1 + k), f.y + dy * (1 + k), 2.5 + k * 4, 0, 7); g.fill(); }
  }
  tileX(IMG.front, A.mid * 2, Math.round(FRONT.lineY));
  // the fires flicker
  const off = (A.mid * 2) % tileW();
  for (const [fx, fy, n] of FRONT.fires) for (let k = 0; k < 2; k++) {
    const x = fx - off + k * tileW(); if (x < -6 || x > 422) continue;
    g.globalAlpha = 0.25 + Math.random() * 0.35; g.fillStyle = '#e3a857';
    g.beginPath(); g.arc(Math.round(x), Math.round(fy + FRONT.lineY), 2 + Math.min(4, n * 0.3), 0, 7); g.fill(); g.globalAlpha = 1;
  }
  for (const p of A.puffs) { g.fillStyle = `rgba(78,80,90,${(p.a || 0.4) * (p.life / p.max)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  for (const tr of A.tracers) if (tr.d >= 0) {
    const a = Math.atan2(tr.ty - tr.y, tr.tx - tr.x);
    g.strokeStyle = '#f1d69a'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(tr.px, tr.py); g.lineTo(tr.px - Math.cos(a) * 5, tr.py - Math.sin(a) * 5); g.stroke();
  }
}

// ---------------------------------------------------------------- the White Front world (all code) and its coast army
// Far to near: still sky, drifting cloud banks, landing ships coming down,
// searchlights, the glacier front line (bunkers fire tracers, flak bursts),
// then the ground with its wrecks (smoking) and flags (waving).
const WORLD = PACK.world || null;
let Wd = null;
function resetWorld() {
  Wd = { ships: [], tracers: [], flak: [], puffs: [], gunT: WORLD.guns.map((_, i) => 0.4 + i * 0.55), shipT: 4 };
  for (let i = 0; i < 3; i++) wShip(50 + i * 150);
}
function wShip(x) {
  const k = Math.floor(rand() * 3);
  Wd.ships.push({ k, x: x ?? 430, y: 22 + rand() * 50 + k * 10, vx: -(5 + rand() * 7) * (1 - k * 0.2), vy: 1 + rand() * 1.4, hit: 0 });
}
const farW = () => IMG.far.width;
function updateWorld(dt) {
  if ((Wd.shipT -= dt) <= 0) { Wd.shipT = 6 + rand() * 5; if (Wd.ships.length < 4) wShip(); }
  for (const sh of Wd.ships) {
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    if (sh.hit && Math.random() < dt * 10) Wd.puffs.push({ x: sh.x + IMG['lander' + sh.k].width * 0.7, y: sh.y + 3, r: 1.6, life: 1.4, max: 1.4, vx: 3, vy: -5, a: 0.4 });
  }
  Wd.ships = Wd.ships.filter((sh) => sh.x > -90 && sh.y < 170);
  const off = (S.far * 2) % farW();
  WORLD.guns.forEach(([gx, gy], i) => {
    if ((Wd.gunT[i] -= dt) > 0) return;
    Wd.gunT[i] = 1.4 + rand() * 2.2;
    for (const k of [0, 1]) {
      const x = gx - off + k * farW(); if (x < 6 || x > 410) continue;
      const near = Wd.ships.filter((sh) => sh.x > x - 40 && sh.x < x + 240);
      const tg = near.length ? near[Math.floor(rand() * near.length)] : null;
      const tx = tg ? tg.x + IMG['lander' + tg.k].width / 2 + (rand() - 0.5) * 24 : x + 50 + rand() * 120, ty = tg ? tg.y + 4 + (rand() - 0.5) * 16 : 16 + rand() * 60;
      for (let j = 0; j < 5; j++) Wd.tracers.push({ x, y: gy, tx, ty, d: -j * 0.07, last: j === 4, ship: tg });
    }
  });
  for (const tr of Wd.tracers) {
    tr.d += dt; if (tr.d < 0) continue;
    const Ld = Math.hypot(tr.tx - tr.x, tr.ty - tr.y), k = Math.min(1, (tr.d * 200) / Ld);
    tr.px = tr.x + (tr.tx - tr.x) * k; tr.py = tr.y + (tr.ty - tr.y) * k;
    if (k >= 1) { tr.done = true; if (tr.last) { Wd.flak.push({ x: tr.tx, y: tr.ty, t: 0 }); if (tr.ship && Math.random() < 0.08) tr.ship.hit = 1; } }
  }
  Wd.tracers = Wd.tracers.filter((tr) => !tr.done);
  for (const f of Wd.flak) f.t += dt;
  Wd.flak = Wd.flak.filter((f) => f.t < 1.2);
  // the wrecks smoke; powder blows off the drifts
  const goff = (S.scroll * 2) % (GR.L * 2);
  for (const d of WORLD.deco) if (d.kind === 'smoke' && Math.random() < dt * 5) for (const k of [0, 1]) {
    const x = d.x - goff + k * GR.L * 2; if (x < -20 || x > 436) continue;
    Wd.puffs.push({ x, y: d.y, r: 2, life: 2.4, max: 2.4, vx: -4, vy: -12, a: 0.45, ground: true });
  }
  if (Math.random() < dt * 6) { const x = 40 + Math.random() * 180; S.fx.push({ k: 'spray', x, y: groundTop(S.scroll + x) - 0.5, vx: -22 - Math.random() * 14, vy: -4 - Math.random() * 6, life: 0.9, max: 0.9 }); }
  for (const p of Wd.puffs) { p.life -= dt; p.x += p.vx * dt - (p.ground ? GROUND_SPEED * 2 * dt : 0); p.y += p.vy * dt; p.r += dt * 2.4; }
  Wd.puffs = Wd.puffs.filter((p) => p.life > 0);
}
function drawWorld() {
  g.drawImage(IMG.sky, 0, 0);
  tileX(IMG.clouds, S.t * 5, -38);
  for (const sh of Wd.ships) {
    const im = IMG['lander' + sh.k]; g.globalAlpha = 0.88 - sh.k * 0.1; g.drawImage(im, Math.round(sh.x), Math.round(sh.y)); g.globalAlpha = 1;
    if (Math.random() < 0.5) { g.fillStyle = 'rgba(242,207,138,0.45)'; for (const f of [0.3, 0.5, 0.7]) g.fillRect(Math.round(sh.x + im.width * f), Math.round(sh.y + im.height - 2), 1, 2 + Math.floor(Math.random() * 3)); }
  }
  const off = (S.far * 2) % farW();
  WORLD.lights.forEach(([lx, ly], i) => {
    for (const k of [0, 1]) {
      const x = lx - off + k * farW(); if (x < -60 || x > 470) continue;
      const a = -1.75 + Math.sin(S.t * 0.45 + i * 1.9) * 0.5, L = 150;
      const gr = g.createLinearGradient(x, ly, x + Math.cos(a) * L, ly + Math.sin(a) * L);
      gr.addColorStop(0, 'rgba(250,244,226,0.34)'); gr.addColorStop(1, 'rgba(250,244,226,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(x, ly); g.lineTo(x + Math.cos(a - 0.07) * L, ly + Math.sin(a - 0.07) * L); g.lineTo(x + Math.cos(a + 0.07) * L, ly + Math.sin(a + 0.07) * L); g.fill();
    }
  });
  tileX(IMG.far, S.far * 2, 0);
  for (const p of Wd.puffs) if (!p.ground) { g.fillStyle = `rgba(86,90,102,${p.a * (p.life / p.max)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  for (const f of Wd.flak) {
    const k = f.t / 1.2;
    if (f.t < 0.08) { g.fillStyle = '#fff1cf'; g.beginPath(); g.arc(f.x, f.y, 4, 0, 7); g.fill(); }
    g.fillStyle = `rgba(70,74,84,${0.7 * (1 - k)})`;
    for (const [dx, dy] of [[0, 0], [3, -2], [-3, 1], [1, 3]]) { g.beginPath(); g.arc(f.x + dx * (1 + k), f.y + dy * (1 + k), 2.4 + k * 4, 0, 7); g.fill(); }
  }
  for (const tr of Wd.tracers) if (tr.d >= 0) { const a = Math.atan2(tr.ty - tr.y, tr.tx - tr.x); g.strokeStyle = '#f1d69a'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(tr.px, tr.py); g.lineTo(tr.px - Math.cos(a) * 5, tr.py - Math.sin(a) * 5); g.stroke(); }
}
function drawWorldNear() {
  const goff = (S.scroll * 2) % (GR.L * 2);
  for (const p of Wd.puffs) if (p.ground) { g.fillStyle = `rgba(92,96,108,${p.a * (p.life / p.max)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
  for (const d of WORLD.deco) if (d.kind === 'flag') for (const k of [0, 1]) {
    const x = d.x - goff + k * GR.L * 2; if (x < -20 || x > 436) continue;
    g.fillStyle = '#c98f4a'; g.beginPath(); g.moveTo(x, d.y);
    for (let i = 0; i <= 12; i++) g.lineTo(x + i, d.y + Math.sin(i * 0.6 - S.t * 7) * 1.4 * (i / 12));
    for (let i = 12; i >= 0; i--) g.lineTo(x + i, d.y + 7 + Math.sin(i * 0.6 - S.t * 7) * 1.4 * (i / 12));
    g.fill(); g.fillStyle = '#e3a857'; g.fillRect(x, d.y + 1, 3, 1);
  }
}

// The army (ChatGPT's coast designs, redrawn sharp at game size), with the
// attacks from its sample: every one warns before it fires (its "open" look).
const CT = PACK.coastTypes || {};
const CHP = { skiff: 4, anchor: 4, roller: 5, dart: 2, bomber: 5, needle: 3, hunter: 3, charge: 1, bomb: 1 };
const CPTS = { skiff: 40, anchor: 50, roller: 60, dart: 30, bomber: 60, needle: 50, hunter: 50, charge: 10, bomb: 10 };

function update(dt) {

  if (FRONT) updateFront(dt);
  if (WORLD) updateWorld(dt);
  if (ct >= CYCLE) { S.cycle++; S.step = 0; }

  const p = S.p;

  else {

    p.x = Math.max(9, Math.min(VW - 9, p.x)); p.y = Math.max(HUD + 4, p.y);

    if (s.y > groundTop(S.scroll + s.x)) { s.dead = true; S.fx.push({ k: 'spray', x: s.x, y: s.y, vx: -10, vy: -15, life: 0.3, max: 0.3 }); continue; }

  if (L.portrait) {
    sc.fillStyle = '#efe3cf'; sc.textAlign = 'center'; sc.font = 'bold 20px ui-monospace, Menlo, monospace';
    sc.fillText('TURN YOUR PHONE SIDEWAYS', L.W / 2, L.H / 2 - 10);
    sc.font = '14px ui-monospace, Menlo, monospace'; sc.fillStyle = '#c9b8a0'; sc.fillText(PACK.label, L.W / 2, L.H / 2 + 18); sc.textAlign = 'left';
    return;
  }
  sc.imageSmoothingEnabled = false;
  sc.drawImage(off, L.gx, L.gy, L.gw, L.gh);
  sc.strokeStyle = '#1b2238'; sc.lineWidth = 2; sc.strokeRect(L.gx - 1, L.gy - 1, L.gw + 2, L.gh + 2);
  // left: the floating pad (or a hint where it will be)
  if (pad.id !== null) {
    sc.strokeStyle = 'rgba(239,227,207,0.35)'; sc.lineWidth = 3; sc.beginPath(); sc.arc(pad.cx, pad.cy, 46, 0, 7); sc.stroke();
    sc.fillStyle = 'rgba(239,227,207,0.5)'; sc.beginPath(); sc.arc(pad.x, pad.y, 20, 0, 7); sc.fill();
  } else if (mode === 'play') {
    const cx = L.side + (L.gx - L.side) / 2, cy = L.gy + L.gh * 0.66;
    sc.strokeStyle = 'rgba(239,227,207,0.13)'; sc.lineWidth = 3; sc.beginPath(); sc.arc(cx, cy, 40, 0, 7); sc.stroke();
    sc.fillStyle = 'rgba(239,227,207,0.25)'; sc.font = 'bold 11px ui-monospace, Menlo, monospace'; sc.textAlign = 'center'; sc.fillText('STEER', cx, cy + 4); sc.textAlign = 'left';
  }
  // right: Fire
  const f = L.fire, held = firing();
  sc.fillStyle = held ? '#e3a857' : '#8a5a2e'; sc.beginPath(); sc.arc(f.x, f.y + 4, f.r, 0, 7); sc.fill();
  sc.fillStyle = held ? '#f2cf8a' : '#c98f4a'; sc.beginPath(); sc.arc(f.x, f.y + (held ? 3 : 0), f.r, 0, 7); sc.fill();
  sc.fillStyle = '#0e1222'; sc.font = `bold ${Math.round(f.r * 0.36)}px ui-monospace, Menlo, monospace`; sc.textAlign = 'center'; sc.fillText('FIRE', f.x, f.y + f.r * 0.13 + (held ? 3 : 0)); sc.textAlign = 'left';
  // which sample this is, small in the left margin
  sc.fillStyle = 'rgba(201,184,160,0.75)'; sc.font = 'bold 11px ui-monospace, Menlo, monospace'; sc.fillText(PACK.side, L.side + 10, L.gy + 16);
  sc.font = '10px ui-monospace, Menlo, monospace'; PACK.sub.split('|').forEach((s, i) => sc.fillText(s, L.side + 10, L.gy + 30 + i * 13));
  if (mode === 'title' || mode === 'over') {
    sc.fillStyle = 'rgba(11,15,28,0.72)'; sc.fillRect(L.gx, L.gy, L.gw, L.gh);
    sc.textAlign = 'center'; const cx = L.gx + L.gw / 2, u = L.gh / 144;
    sc.fillStyle = '#efe3cf'; sc.font = `bold ${Math.round(14 * u)}px ui-monospace, Menlo, monospace`;
    sc.fillText(mode === 'title' ? 'THE WHITE FRONT' : 'GAME OVER', cx, L.gy + 40 * u);
    sc.fillStyle = '#e3a857'; sc.font = `bold ${Math.round(8 * u)}px ui-monospace, Menlo, monospace`;
    sc.fillText(mode === 'title' ? PACK.label : `SCORE ${S.score}   BEST ${best}`, cx, L.gy + 58 * u);
    sc.fillStyle = '#c9b8a0'; sc.font = `${Math.round(6.5 * u)}px ui-monospace, Menlo, monospace`;
    if (mode === 'title') { sc.fillText('A look sample, not the finished level.', cx, L.gy + 76 * u); sc.fillText('Left thumb: steer anywhere.  Right thumb: hold FIRE.', cx, L.gy + 88 * u); }
    if (mode === 'title' || overT > 1.2) { if (Math.floor(performance.now() / 500) % 2 === 0) { sc.fillStyle = '#efe3cf'; sc.font = `bold ${Math.round(8 * u)}px ui-monospace, Menlo, monospace`; sc.fillText(mode === 'title' ? 'TAP TO PLAY' : 'TAP TO FLY AGAIN', cx, L.gy + 112 * u); } }
    sc.textAlign = 'left';
  }
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (!L.portrait) {
    if (mode === 'title') { S.t += 0; if (tapped) { tapped = false; reset(); mode = 'play'; full(); } }
    else if (mode === 'play') update(dt);
    else if (mode === 'over') { overT += dt; update(dt); if (tapped && overT > 1.2) { tapped = false; reset(); mode = 'play'; } }
  }
  tapped = false;
  draw(); present();
}
function full() { try { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); } catch (e) { /* phones without full screen */ } }
document.addEventListener('visibilitychange', () => { last = performance.now(); });

layout();
loadAll().then(() => { reset(); requestAnimationFrame(frame); });
</script>
