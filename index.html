<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ember Drift</title>
  <style>
    :root {
      --void: #0b0f1c;
      --space: #141a2e;
      --space-mid: #232c4a;
      --amber: #e3a857;
      --amber-light: #f2cf8a;
      --amber-soft: #c98f4a;
      --red: #a8544a;
      --red-dark: #7a3a36;
      --cream: #efe3cf;
      --dim: #9c9584;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--void);
      color: var(--cream);
      font-family: var(--mono);
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#screen {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      text-align: center;
      background: rgba(11, 15, 28, 0.72);
      touch-action: none;
      cursor: pointer;
    }
    .overlay[hidden] { display: none; }
    h1 {
      font-size: clamp(30px, 8vh, 58px);
      letter-spacing: 0.14em;
      color: var(--amber);
      text-shadow: 3px 3px 0 var(--red-dark);
    }
    .big {
      font-size: clamp(16px, 4.6vh, 22px);
      color: var(--amber-light);
      letter-spacing: 0.08em;
    }
    .pulse { animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .hint {
      display: flex;
      gap: 28px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--dim);
    }
    .hint b { color: var(--cream); font-weight: 600; }
    .small { font-size: 11px; color: var(--dim); }
    #rotate { background: var(--void); z-index: 10; cursor: default; }
    .phone {
      width: 44px;
      height: 76px;
      border: 4px solid var(--amber-soft);
      border-radius: 9px;
      animation: turn 2.2s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 25% { transform: rotate(0deg); }
      55%, 100% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="start" class="overlay">
    <h1>EMBER DRIFT</h1>
    <p class="big pulse">TAP TO START</p>
    <div class="hint">
      <p><b>Left thumb</b><br>touch anywhere &amp; slide to steer</p>
      <p><b>Right thumb</b><br>hold FIRE &middot; tap SPECIAL</p>
    </div>
    <p class="small" data-version></p>
  </div>

  <div id="pause" class="overlay" hidden>
    <h1>PAUSED</h1>
    <p class="big pulse">TAP TO CARRY ON</p>
  </div>

  <div id="rotate" class="overlay" hidden>
    <div class="phone"></div>
    <p class="big">Turn your phone sideways</p>
    <p class="small">Ember Drift is played in landscape</p>
  </div>

  <script type="module" src="js/main.js?v=0.24.0"></script>
</body>
</html>
